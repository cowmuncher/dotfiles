##############################################
#                                            #
#              Swag Theme                    #
#                                            #
##############################################

# Adapted from the "Nord Theme" for superfile to match the colors
# of an ncspot config.toml (dark grays with a red accent).

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.
# Swapped to a darker, low-saturation style to match the grayscale palette below.

code_syntax_highlight = "monokai"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#EEEEEE"
full_screen_bg = "#191919"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#BBBBBB", "#FF0000"]

#-- File Panel
file_panel_fg = "#BBBBBB"
file_panel_bg = "#191919"
file_panel_border = "#444444"
file_panel_border_active = "#EEEEEE"
file_panel_top_directory_icon = "#888888"
file_panel_top_path = "#888888"
file_panel_item_selected_fg = "#EEEEEE"
file_panel_item_selected_bg = "#666666"

#-- Footer
footer_fg = "#EEEEEE"
footer_bg = "#222222"
footer_border = "#444444"
footer_border_active = "#888888"

#-- Sidebar
sidebar_fg = "#BBBBBB"
sidebar_bg = "#191919"
sidebar_title = "#EEEEEE"
sidebar_border = "#191919"
sidebar_border_active = "#666666"
sidebar_item_selected_fg = "#EEEEEE"
sidebar_item_selected_bg = "#666666"
sidebar_divider = "#444444"

#-- Modals
modal_fg = "#EEEEEE"
modal_bg = "#222222"
modal_border_active = "#888888"
modal_cancel_fg = "#BBBBBB"
modal_cancel_bg = "#444444"
modal_confirm_fg = "#EEEEEE"
modal_confirm_bg = "#FF0000"

#-- Help Menu
help_menu_hotkey = "#888888"
help_menu_title = "#EEEEEE"

#-- Special
cursor = "#EEEEEE"
correct = "#888888"
error = "#FF0000"
hint = "#BBBBBB"
cancel = "#444444"
